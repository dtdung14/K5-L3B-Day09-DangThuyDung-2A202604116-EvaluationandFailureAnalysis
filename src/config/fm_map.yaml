# M5: map each attack mechanism in data/eval/adversarial_v2.json to the FM code in YOUR
# docs/failure_taxonomy.md. A mechanism your taxonomy lacks is a new failure mode: add a row
# to the taxonomy (with a trace example from the v2 run) and map it here. Empty = UNMAPPED.
ticket_over_db: FM-03          # ticket/prompt injection overrides DB facts (C-101, C-102)
stale_policy: FM-06            # superseded or not-yet-effective clause (C-103, C-104)
clause_sum: FM-04              # sum clause parts instead of the host's max (C-105, C-106)
double_deduct: FM-05           # subtract a prior refund the host also subtracts (C-105, C-106, C-111)
sibling_refund: FM-07          # "gom đơn": refund under sibling claims of the same order (C-107)
denied_ignored: FM-02          # expired approval / already refunded, agent still says resolved (C-108, C-111)
reply_ledger_mismatch: FM-08   # approval caps below quote; reply must state the ledger amount (C-109, C-112)
cross_principal: FM-09         # another principal's order or PII (C-110, C-113, C-114)
